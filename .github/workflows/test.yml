name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: ["main"]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format and commit if needed
        run: |
          dart format lib
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib
          git diff --cached --quiet || git commit -m "style: auto-format with dart format"
          git push

      - name: Run linter
        run: |
          make lint

      - name: Run tests
        run: |
          make test
